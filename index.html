<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- page-metadata:start -->
    <title>Daan van Vugt — Software developer</title>
    <meta
      name="description"
      content="Daan van Vugt. Software developer with 3 years of professional experience in web and mobile applications, backend services, and testing."
    />
    <!-- page-metadata:end -->
    <meta name="theme-color" content="#f6f7fb" />
    <script>
      try {
        const saved = localStorage.getItem('portfolio-theme')
        document.documentElement.dataset.theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
      } catch {
        document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light'
      }
    </script>
    <noscript>
      <style>
        .name-fallback {
          opacity: 1 !important;
        }
        .name-loading,
        .case-study-tabs,
        .site-header-actions,
        .landing-controls,
        .motion-toggle {
          display: none !important;
        }
        .case-study-panel[data-state='inactive'] {
          display: grid !important;
          margin-top: 1.5rem;
        }
        .site-header nav {
          display: flex !important;
          flex-wrap: wrap;
        }
        @media (max-width: 700px) {
          .site-header {
            flex-wrap: wrap !important;
            height: auto;
            min-height: var(--header-height);
            padding-block: 16px;
          }
          .site-header nav {
            width: 100%;
            justify-content: space-between;
          }
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
